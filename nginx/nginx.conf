events {
  worker_connections 1024;
}

http {
  upstream api_backend {
    server backend:3000;
  }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://api_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}